name: Release Crew

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: crew-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux]
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build checksummed release archive
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bash scripts/package.sh "$version" "$TARGET_OS" "$TARGET_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: crew-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crew-*
          merge-multiple: true
          path: dist
      - name: Generate formula and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/render_formula.py --version "$version" --assets dist --output dist/crew.rb --cask-output dist/crew-cask.rb
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ruby -c dist/crew.rb
          ruby -c dist/crew-cask.rb
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/crew.rb dist/crew-cask.rb \
            --verify-tag --title "Tesserix Crew $GITHUB_REF_NAME" \
            --notes "macOS: brew install --cask tesserix/tap/crew. Linux: brew install tesserix/tap/crew. Existing agent CLI logins are reused."
      - name: Check tap publishing credential
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Set HOMEBREW_TAP_GITHUB_TOKEN to publish Formula/crew.rb automatically. The formula is attached to this release for manual publication.'
          fi
      - uses: actions/checkout@v4
        if: steps.tap.outputs.enabled == 'true'
        with:
          repository: tesserix/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
          persist-credentials: true
      - name: Publish tap formula
        if: steps.tap.outputs.enabled == 'true'
        run: |
          cp dist/crew.rb tap/Formula/crew.rb
          mkdir -p tap/Casks
          cp dist/crew-cask.rb tap/Casks/crew.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/crew.rb Casks/crew.rb
          git commit -m "crew $GITHUB_REF_NAME"
          git push origin HEAD:main
